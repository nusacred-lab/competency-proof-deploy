name: Deployment checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check deployment boundaries and generated configuration
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax, local documentation links and source policy
        run: python3 scripts/check-repository.py
